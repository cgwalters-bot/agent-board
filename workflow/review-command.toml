# Only someone with write access may request a review, forks included.
hosts = ["github.com"]
repos = ["cgwalters-forge/agent-board"]
bases = ["main"]
max_outputs = 11
max_patch_bytes = 1024
max_patch_files = 1

[github.outputs]
add_comment = { max = 1 }
noop = { max = 1 }
# Inline findings beside the verdict (cgwalters-review.yml), held to the pull request.
create_pull_request_review_comment = { max = 10 }

[github.trigger]
events = ["issue_comment"]
roles = ["admin", "maintain", "write"]
bots = []
forks = true
commands = ["/review"]
