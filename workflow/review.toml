# Automatic events admit forks; the reusable caller restricts automatic
# starts to OWNER/MEMBER/COLLABORATOR, and to bots whose user id the
# REVIEW_BOT_IDS variable lists, to prevent shared-budget exhaustion.
# A bot so listed must also be named in `bots`: these bounds check the
# actor, the caller's `if:` the author.
hosts = ["github.com"]
repos = ["cgwalters-forge/agent-board"]
bases = ["main"]
max_outputs = 1
max_patch_bytes = 1024
max_patch_files = 1

[outputs]
add_comment = { max = 1 }
noop = { max = 1 }

[trigger]
events = ["pull_request_target", "pull_request"]
roles = ["all"]
# A `[bot]` login is a GitHub App's; no user can take it.
bots = ["dependabot[bot]"]
forks = true
