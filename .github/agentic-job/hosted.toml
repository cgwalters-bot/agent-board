# Caller-owned configuration for the hosted ubuntu-26.04 runner.
# Stop unused local daemons so the sandbox user cannot use their sockets
# to escape its privilege and egress restrictions; sandbox check verifies it.
[sandbox]
stop-services = [
    "docker.socket",
    "docker.service",
    "containerd.service",
    "ssh.socket",
    "ssh.service",
    "sshd-unix-local.socket",
    "snapd.socket",
    "snapd.service",
    "multipathd.socket",
    "multipathd.service",
    "uuidd.socket",
    "uuidd.service",
    "iscsid.socket",
    "iscsid.service",
]

[sandbox.check]
# Required host networking services. resolved permits DNS queries by any
# user; these exceptions do not claim to prevent DNS exfiltration.
allow-sockets = [
    "/run/systemd/resolve/",
    "/run/systemd/netif/",
    "/run/systemd/resolve.hook/",
]

[setup]
packages = ["python3-venv", "nftables", "podman", "uidmap"]

[setup.repo-packages]
"cgwalters-forge/agent-board" = ["cargo", "default-jre-headless", "nodejs"]

[commit]
author = "agentic-job <agentic-job@users.noreply.github.com>"
trailers = ["Generated-by: AI"]
