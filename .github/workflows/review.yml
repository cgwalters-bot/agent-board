name: review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions: {}
jobs:
  review:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    # Base-owned policy; the head is fetched only as data inside the sandbox.
    # Our own workflows follow main (cgwalters-forge/tracker#544); third-party
    # actions stay pinned by commit. The permissions below go to whatever is on
    # agentic-job main, so a change merged there can post this repository's
    # review comment and status: that branch's review is part of this gate.
    uses: cgwalters-forge/agentic-job/.github/workflows/review.yml@main
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
      id-token: write
      statuses: write
