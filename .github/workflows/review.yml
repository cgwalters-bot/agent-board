name: review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions: {}
jobs:
  review:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    # Base-owned policy; the head is fetched only as data inside the sandbox.
    uses: cgwalters-forge/agentic-job/.github/workflows/review.yml@0d5e8dc31705dd50dfe3900714a13b5e6343355d
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
      id-token: write
      statuses: write
