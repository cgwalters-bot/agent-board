name: review
on:
  # The base's reusable workflow runs; no step here checks out or runs the
  # head (test_review.py enforces that), so this trigger is accepted.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions: {}
jobs:
  review:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    # Base-owned policy; the head is fetched only as data inside the sandbox.
    # agentic-job is referenced by release tag: following main failed runs that
    # spanned a merge there (cgwalters-forge/tracker#544). Dependabot proposes
    # newer tags. The permissions below go to whatever that tag names, so
    # agentic-job's release process is part of this gate.
    uses: cgwalters-forge/agentic-job/.github/workflows/review.yml@v0.1.0
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
      id-token: write
      statuses: write
