name: review
on:
  # The base's reusable workflow runs; no step here checks out or runs the
  # head (test_review.py enforces that), so this trigger is accepted.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions: {}
jobs:
  review:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    # Base-owned policy; the head is fetched only as data inside the sandbox.
    # Our deployment's wrapper (tailnet join, agent and inference defaults)
    # around agentic-job v0.5.0, pinned by commit: the permissions below go
    # to whatever this names, so a change to it is reviewed here. The
    # tailnet and inference broker must admit its job_workflow_ref.
    uses: cgwalters-forge/actions/.github/workflows/cgwalters-review.yml@0d43005f548ae6d434b3a255b6032204efb10498 # agentic-job v0.5.0
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
      id-token: write
      statuses: write
