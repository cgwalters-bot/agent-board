name: ci
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Do not cancel a green main commit's publication when the next push arrives.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository] Check this revision's release build without publishing.
    with:
      release: build-${{ github.sha }}
  specs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hosted Ubuntu supplies Java, Rust and curl. The Rust harness pins TLC's hash.
      - run: bash specs/check.sh
      - run: python3 .github/agentic-job/test_review.py
  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned as in the lint job.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.58.0
      # Format, clippy and tests, as agents run them before handing back.
      - run: just check
      # The CLI against the fixture, as a user would run it.
      - run: cargo run --locked -q -p agent-board -- item list --snapshot fixtures/board.json
      - run: cargo run --locked -q -p agent-board -- reconcile plan --snapshot fixtures/board.json --emit
      - run: cargo run --locked -q -p agent-board -- project view --snapshot fixtures/board.json --json project,coverage

  # The Forgejo pass against a real, disposable Forgejo
  # (crates/agent-board/tests/forgejo_live.rs, docs/forges.md#live-ci), as
  # agentic-job's forgejo job runs one: a service container on loopback,
  # whose users and tokens the test makes at run time, and a pinned runner
  # container the test starts beside it. No secret of this repository, the
  # workflow's contents: read token and no persisted credentials. Not in the
  # Required by the ci sentinel, including Status/private snapshot coverage.
  forgejo:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      forgejo:
        # v17.0.1, the release docs/forges.md checks; bumped by hand.
        image: data.forgejo.org/forgejo/forgejo@sha256:fcd19ff4ebc85fb098a67e8e1d0d5a84d07dd6e8a23edcfdfd5b71a6178953be
        env:
          FORGEJO__security__INSTALL_LOCK: "true"
          FORGEJO__server__ROOT_URL: http://127.0.0.1:3000/
        ports:
          - 127.0.0.1:3000:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked -p agent-board --test forgejo_live -- --ignored --nocapture
        env:
          AGENT_BOARD_TEST_FORGEJO: http://127.0.0.1:3000
          AGENT_BOARD_TEST_FORGEJO_CONTAINER: ${{ job.services.forgejo.id }}

  # The shared workflow check, through the Justfile's lint recipe. The
  # checked-out actions repository is code run here, with only this job's
  # contents: read token and no persisted credentials; it follows main like
  # our other cgwalters-forge references (cgwalters-forge/tracker#544).
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agent-board
          persist-credentials: false
      # Beside the repository, not inside it, so it is not linted as ours.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgwalters-forge/actions
          ref: main
          path: actions
          persist-credentials: false
      # Pinned as the shared lint action pins it when this was written;
      # Dependabot updates this copy separately.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just@1.58.0
      - run: just lint
        working-directory: agent-board

  # Require only ci in the ruleset, on both PR and merge-group commits.
  ci:
    if: ${{ always() }}
    needs: [specs, rust, lint, build, forgejo]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  # Main-push only: never sign PR/merge-group artifacts or grant their code OIDC.
  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-board
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: dist/release.json
      - name: Stage verification bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir provenance
          cp "$BUNDLE" provenance/provenance.jsonl
      - name: Verify without a token
        run: >-
          GH_TOKEN='' GITHUB_TOKEN='' gh attestation verify dist/release.json
          --bundle provenance/provenance.jsonl --repo "$GITHUB_REPOSITORY"
          --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main"
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/
          if-no-files-found: error

  # Only this job can tag/publish; it executes no project code or built binary.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, attest]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: build-${{ github.sha }}
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-board
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
      - run: sha256sum --check SHA256SUMS
      # Explicit creation refuses tag reuse rather than attaching these assets
      # to another commit. A partial failure needs maintainer cleanup, not force.
      - name: Tag green commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"
          -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
      - name: Publish prerelease (never Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false \
            --title "$TAG" --notes "Static binaries for green main commit $GITHUB_SHA." \
            "agent-board-$TARGET" "gh-agent-board-$TARGET" SHA256SUMS release.json provenance.jsonl
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
