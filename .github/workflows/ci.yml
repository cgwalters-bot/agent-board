name: ci
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  specs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hosted Ubuntu supplies Java, Node and curl. The harness pins TLC's hash.
      - run: bash specs/check.sh
      - run: python3 .github/agentic-job/test_review.py
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned as in the lint job.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.58.0
      # Format, clippy and tests, as agents run them before handing back.
      - run: just check
      # The CLI against the fixture, as a user would run it.
      - run: cargo run --locked -q -p agent-board -- item list --snapshot fixtures/board.json
      - run: cargo run --locked -q -p agent-board -- reconcile plan --snapshot fixtures/board.json --emit
      - run: cargo run --locked -q -p agent-board -- project view --snapshot fixtures/board.json --json project,coverage

  # The shared workflow check, through the Justfile's lint recipe. The
  # checked-out actions repository is code run here, with only this job's
  # contents: read token and no persisted credentials; it follows main like
  # our other cgwalters-forge references (cgwalters-forge/tracker#544).
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agent-board
          persist-credentials: false
      # Beside the repository, not inside it, so it is not linted as ours.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgwalters-forge/actions
          ref: main
          path: actions
          persist-credentials: false
      # Pinned as the shared lint action pins it when this was written;
      # Dependabot updates this copy separately.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.58.0
      - run: just lint
        working-directory: agent-board

  # Require only ci in the ruleset, on both PR and merge-group commits.
  ci:
    if: ${{ always() }}
    needs: [specs, rust, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
