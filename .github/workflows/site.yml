# The documentation site: a build and link check on every change and on
# main, after secure-host, with a read-only token and no secret; on main a
# deploy to GitHub Pages. Pages with source "GitHub Actions" is a
# repository setting; until it is on, deploy fails and nothing is
# published. The shape is agentic-job's site.yml, so both sites pass the
# same checks.
#
# Only deploy holds the Pages write grant and the OIDC request credential
# deploy-pages needs. It is a deploy-only job as `agentic-job workflows
# check` admits it (agentic-job docs/workflows-check.md, "Deploy-only Pages
# jobs"): no checkout, no run step, no env, nothing from the repository
# beside those credentials; it publishes the artifact the hardened check
# job uploaded. deploy-pages is pinned at v5.0.1 (node24, same inputs as
# v4); the check admits it once its allowlist names that commit. What is
# published is therefore only as good as main's site/ code and the locked dependencies that build it.
name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The toolchain first: no step may run between the checkout and
      # secure-host, with root and the checked-out tree.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reviewed root action pin, including c9a9501: stop acpid's socket
      # and service so the sandbox cannot reach that unnecessary daemon
      # (tracker#1212). Keep the default hosted config and strict check;
      # the action verifies the digest-pinned v0.6.4 image's signer first.
      - uses: cgwalters-forge/actions/secure-host@c763a8950778743f51857a37b2a59daf9e96ee23 # secure-host:v0.6.4; stops acpid
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.58.0
      - run: just site-test
      - run: just site-build
      # `just site-check`, with lychee from its action. The action's shell
      # evaluates args, so it expands $GITHUB_WORKSPACE (lychee wants an
      # absolute root), which the checker refuses as an expression here.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --index-files index.html,. --no-progress --root-dir "$GITHUB_WORKSPACE/site/dist" "site/dist/**/*.html"
          failIfEmpty: true
          fail: true
      # The checked build is served at /; the published one under the
      # project site's base path, with links to files at this commit.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: just site-build-pages
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
