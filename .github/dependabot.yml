version: 2
updates:
  # Third-party actions are pinned by commit and agentic-job by release tag;
  # this proposes their updates. Other cgwalters-forge references follow @main.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Skip releases younger than this, so a compromised release that is
    # yanked quickly is never proposed.
    cooldown:
      default-days: 7
    # One pull request per agentic-job release, whichever of its workflows or
    # actions are referenced.
    groups:
      agentic-job:
        patterns:
          - "cgwalters-forge/agentic-job"
          - "cgwalters-forge/agentic-job/*"
